name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: releases
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: latest-stable
      - name: Validate release tag
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - name: Resolve locked dependencies and test
        run: |
          swift package resolve
          swift test --disable-automatic-resolution
      - name: Build without release secrets
        env:
          BUILD_ARCH: arm64
        run: bash scripts/bundle.sh
      - name: Preserve framework symlinks and permissions
        run: ditto -c -k --keepParent "dist/Don't Miss.app" dist/DontMiss-build.zip
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: unsigned-bundle
          path: dist/DontMiss-build.zip
          if-no-files-found: error
          retention-days: 1

  release:
    needs: build
    runs-on: macos-15
    timeout-minutes: 75
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: latest-stable
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: unsigned-bundle
          path: dist
      - name: Prepare unsigned bundle and verified signing tools
        run: |
          set -euo pipefail
          echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          ditto -x -k dist/DontMiss-build.zip dist
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/sparkle.zip" \
            https://github.com/sparkle-project/Sparkle/releases/download/2.10.0/Sparkle-for-Swift-Package-Manager.zip
          printf '17e28312b8e18ab7cdbbe09a6fb28cc55a5479ec6c371dbc07cdecd2a14fd959  %s\n' \
            "$RUNNER_TEMP/sparkle.zip" | shasum -a 256 --check
          ditto -x -k "$RUNNER_TEMP/sparkle.zip" "$RUNNER_TEMP/sparkle-tools"
      # Match Davit's rotation hardening: no raw secrets at workflow/job scope.
      # Build/test ran on a separate runner; private keys are never cached.
      - name: Import the pinned certificate and sign
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          set +x
          set -euo pipefail
          umask 077
          : "${MACOS_CERT_P12:?Missing MACOS_CERT_P12}"
          : "${MACOS_CERT_PASSWORD:?Missing MACOS_CERT_PASSWORD}"
          CERT="$RUNNER_TEMP/dontmiss-signing.p12"
          KEYCHAIN="$RUNNER_TEMP/dontmiss-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "::add-mask::$KEYCHAIN_PASSWORD"
          trap 'rm -f "$CERT"; security delete-keychain "$KEYCHAIN"' EXIT
          printf '%s' "$MACOS_CERT_P12" | base64 --decode > "$CERT"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$CERT" -k "$KEYCHAIN" -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          rm -f "$CERT"
          unset MACOS_CERT_P12 MACOS_CERT_PASSWORD
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          unset KEYCHAIN_PASSWORD
          security list-keychains -d user -s "$KEYCHAIN" "$HOME/Library/Keychains/login.keychain-db"
          EXPECTED_CERT_SHA1="89AFE2B56FFCB7344A7600B5E38E97C68A544591"
          security find-identity -v -p codesigning "$KEYCHAIN" | grep -F "$EXPECTED_CERT_SHA1" >/dev/null || {
            echo "Wrong signing certificate. Export the rotated certificate pinned in Davit." >&2
            exit 1
          }
          CODESIGN_IDENTITY="$EXPECTED_CERT_SHA1" bash scripts/sign.sh
          lipo -verify_arch arm64 "dist/Don't Miss.app/Contents/MacOS/DontMiss"
      - name: Notarize and staple
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: bash scripts/notarize.sh
      - name: Archive notarized application
        run: bash scripts/prepare-release.sh
      - name: Sign update archive and appcast
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          set +x
          set -euo pipefail
          : "${SPARKLE_PRIVATE_KEY:?Missing SPARKLE_PRIVATE_KEY}"
          printf '%s' "$SPARKLE_PRIVATE_KEY" |
            env -u SPARKLE_PRIVATE_KEY "$RUNNER_TEMP/sparkle-tools/bin/generate_appcast" \
              --ed-key-file - \
              --download-url-prefix "https://github.com/wouterdebie/dontmiss/releases/download/$GITHUB_REF_NAME/" \
              --maximum-deltas 0 \
              dist/release
          test -s dist/release/appcast.xml
          SIGNATURE="$(xmllint --xpath 'string(/rss/channel/item/enclosure/@*[local-name()="edSignature"])' dist/release/appcast.xml)"
          test -n "$SIGNATURE"
          printf '%s' "$SPARKLE_PRIVATE_KEY" |
            env -u SPARKLE_PRIVATE_KEY "$RUNNER_TEMP/sparkle-tools/bin/sign_update" \
              --ed-key-file - --verify dist/release/appcast.xml
          printf '%s' "$SPARKLE_PRIVATE_KEY" |
            env -u SPARKLE_PRIVATE_KEY "$RUNNER_TEMP/sparkle-tools/bin/sign_update" \
              --ed-key-file - --verify "dist/release/DontMiss-$VERSION.zip" "$SIGNATURE"
      - name: Publish complete release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" --verify-tag --draft \
            --title "Don't Miss $VERSION" --generate-notes \
            "dist/release/DontMiss-$VERSION.zip" \
            "dist/release/DontMiss-$VERSION.zip.sha256" \
            dist/release/appcast.xml
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest
